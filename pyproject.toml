[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx"
version = "0.1.1"
description = "A deliberately tiny coding agent for self-hosted models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx",
    "rich",
]

[project.scripts]
nx = "nx:main"

[tool.setuptools]
packages = ["nx"]

[dependency-groups]
dev = ["pytest"]
