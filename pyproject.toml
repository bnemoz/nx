[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx"
version = "0.7.5"
description = "A deliberately tiny coding agent for self-hosted models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx",
    "rich",
]

[project.scripts]
nx = "nx:main"

[tool.setuptools]
packages = ["nx"]

[dependency-groups]
dev = ["pytest"]

[tool.ruff.lint.per-file-ignores]
# nx/__init__.py re-exports names from submodules (consumed as `nx.X` by tests
# and external callers) and imports each submodule right above the section of
# code that uses it, rather than all at the top — both intentional.
"nx/__init__.py" = ["F401", "E402"]
