[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx"
version = "0.152.4"
description = "A deliberately tiny coding agent for self-hosted models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nishant Mishra" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx",
    "rich",
]

[project.urls]
Homepage = "https://github.com/nmishra93/nx"
Repository = "https://github.com/nmishra93/nx"
Issues = "https://github.com/nmishra93/nx/issues"

[project.optional-dependencies]
# PDF mentions work out of the box via mupdf-tools/poppler-utils/tesseract on
# PATH (see nx/_pdf_cli.py); pymupdf4llm remains a pip-only in-process
# fallback for environments with none of those binaries.
pdf = ["pymupdf4llm"]

[project.scripts]
nx = "nx:main"

[tool.pytest.ini_options]
# --dist loadfile: an entire test module lands on one xdist worker. Arbitrary
# packing re-exposed cross-file residue during migration (15 flaky failures);
# per-file packing is deterministic and matches the suite's isolation rules.
# (0.145.1: the old ~+14s wall tax was straggler sleeps, not the packing —
# with them removed loadfile runs ~14s, so this stays the default. See
# docs/test-architecture.md §2.)
addopts = "--dist loadfile"
markers = [
    # Tier B (docs/test-architecture.md §4): file reloads nx, writes NX_* env
    # at module scope, or mutates nx globals in place. Auto-applied from
    # _nxtest._GLOBALS_FILES; opts the file into conftest's module-dict
    # rewind. Tier A files (unmarked) skip that walk entirely.
    "globals: test file depends on process-global nx state (module rewind on)",
]

[tool.setuptools]
packages = ["nx"]

[dependency-groups]
dev = ["pytest", "pytest-xdist>=3.8", "ruff", "ty"]

[tool.ruff.lint]
# Explicit so every ruff version lints identically (0.16+ defaults to all
# stable rules; the project gate is the classic E4/E7/E9/F set).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# nx/__init__.py re-exports names from submodules (consumed as `nx.X` by tests
# and external callers) and imports each submodule right above the section of
# code that uses it, rather than all at the top — both intentional.
"nx/__init__.py" = ["F401", "E402"]

# Test files insert the repo root on sys.path before importing nx (E402 is
# the setup preamble), use terse loop vars (`l` over lines), lambda stubs for
# monkeypatching, and a few keep-someone-honest assignments — all deliberate
# test ergonomics, not lint targets. Style rules are relaxed for tests/** only;
# F811/F821/F541 stay on so real shadowing/undefined-name bugs still surface.
"tests/**" = ["E402", "E702", "E731", "E741", "F841"]

# scripts/ holds standalone harnesses (ram stress, table regen) with the same
# terse style as tests — semicolon-packed state setup, lambdas — not lint targets.
"scripts/**" = ["E402", "E702", "E731", "E741", "F841"]

[[tool.ty.overrides]]
# The test suite drives nx through its deliberately dynamic seams:
# `nx.<STATE_NAME>` reads/writes go through _StateProxyModule.__getattr__,
# fixtures monkeypatch module attributes (m._confirm, m.print, nx.client, …)
# with test doubles, and negative tests pass malformed arguments on purpose
# to exercise runtime validation. Static resolution of those attribute reads
# and signature checks is wrong by design here, so the dynamic-access rules
# are disabled for tests/** only — the nx/ package itself stays fully strict.
include = ["tests/**"]
rules.unresolved-attribute = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-argument-type = "ignore"
rules.not-subscriptable = "ignore"
rules.not-iterable = "ignore"
rules.unsupported-operator = "ignore"
rules.unresolved-import = "ignore"
rules.possibly-missing-submodule = "ignore"
